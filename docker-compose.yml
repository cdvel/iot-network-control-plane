version: '3.8'

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "50051:50051"  # gRPC
      - "8080:8080"    # REST API
    environment:
      - LOG_LEVEL=info
    networks:
      - device-network

  device-router-1:
    build:
      context: .
      dockerfile: Dockerfile.device
    command: ["-server", "control-plane:50051", "-type", "router", "-hostname", "router-1"]
    depends_on:
      - control-plane
    networks:
      - device-network

  device-router-2:
    build:
      context: .
      dockerfile: Dockerfile.device
    command: ["-server", "control-plane:50051", "-type", "router", "-hostname", "router-2"]
    depends_on:
      - control-plane
    networks:
      - device-network

  device-ap-1:
    build:
      context: .
      dockerfile: Dockerfile.device
    command: ["-server", "control-plane:50051", "-type", "ap", "-hostname", "access-point-1"]
    depends_on:
      - control-plane
    networks:
      - device-network

  device-gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.device
    command: ["-server", "control-plane:50051", "-type", "gateway", "-hostname", "gateway-1"]
    depends_on:
      - control-plane
    networks:
      - device-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - device-network

networks:
  device-network:
    driver: bridge